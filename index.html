<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MercaMoz</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

header {
    background: #087f3e;
    color: white;
    padding: 20px;
    text-align: center;
}

.search {
    padding: 15px;
    background: white;
}

input {
    width: 90%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

.container {
    padding: 15px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 6px #ccc;
}

button {
    background: #087f3e;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
}

footer {
    text-align: center;
    padding: 20px;
    color: #777;
}
</style>
</head>

<body>

<header>
    <h1>🛒 MercaMoz</h1>
    <p>Compre e venda em Moçambique</p>
</header>

<div class="search">
    <input type="text" placeholder="Pesquisar produtos...">
</div>

<div class="container">

    <div class="card">
        <h2>📱 Telefones</h2>
        <p>Encontre telefones novos e usados.</p>
        <button>Ver produtos</button>
    </div>

    <div class="card">
        <h2>🚗 Automóveis</h2>
        <p>Carros, motas e outros veículos.</p>
        <button>Ver produtos</button>
    </div>

    <div class="card">
        <h2>🏠 Imóveis</h2>
        <p>Casas, terrenos e apartamentos.</p>
        <button>Ver anúncios</button>
    </div>

    <div class="card">
        <h2>➕ Vender</h2>
        <p>Publique o seu produto no MercaMoz.</p>
        <button>Adicionar anúncio</button>
    </div>

</div>

<footer>
    © 2026 MercaMoz
</footer>

</body>
</html>
